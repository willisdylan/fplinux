# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/fplinux,ums9117-f286-radio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Ruio F286 baseband power-on and DSP bring-up

maintainers:
  - FPLinux contributors <313246064+fplinux-dev@users.noreply.github.com>

description: |
  Research driver for the Ruio F286 (UMS9117) baseband. It powers on the
  whale die and loads and releases the GSM and LTE DSPs in the order the
  stock firmware uses, one step per sysfs attribute. The node has no reg:
  the driver maps the fixed AON, PMU and DSP windows itself, like the rest
  of the F286 support. Nothing touches hardware until an attribute is
  written.

properties:
  compatible:
    const: fplinux,ums9117-f286-radio

  firmware-name:
    items:
      - description: LTE DSP image
      - description: GSM DSP image

required:
  - compatible
  - firmware-name

additionalProperties: false

examples:
  - |
    radio {
        compatible = "fplinux,ums9117-f286-radio";
        firmware-name = "ums9117/f286-lte-dsp.bin",
                        "ums9117/f286-gsm-dsp.bin";
    };
